<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caraga Dengue Hotspot Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<style>
  :root{
    --ink:#1c2b24; --paper:#f6f4ee; --line:#d8d2c2; --accent:#0f6b4c;
    --danger:#b3311c; --panel:#ffffffee;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%;margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--ink);}
  #hdr{position:relative;z-index:1000;padding:10px 16px calc(10px + env(safe-area-inset-top,0px));background:var(--ink);color:#fff;}
  #hdr h1{margin:0;font-size:16px;font-weight:700;}
  #hdr p{margin:2px 0 0;font-size:11.5px;opacity:.8;}
  #map{position:absolute;top:56px;bottom:0;left:0;right:0;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:8px 10px;font-size:12px;}
  .legend .row{display:flex;align-items:center;gap:6px;margin:2px 0;}
  .legend .sw{width:14px;height:14px;border-radius:3px;flex:none;}
  select,input{font-size:12px;padding:4px 6px;border-radius:5px;border:1px solid var(--line);}
  .src{font-size:10px;color:#555;margin-top:4px;line-height:1.4;}
  .popup-title{font-weight:700;margin-bottom:2px;}
  .badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;color:#fff;margin-left:4px;}
</style>
</head>

</div>
<div id="map"></div>

126.307,8.881],[126.325,8.897],[126.322,8.921],[126.294,8.923],[126.294,8.933],[126.31,8.936],[126.307,8.956],[126.286,8.977],[126.271,8.97],[126.196,9.082],[126.169,9.087],[126.158,9.105],[126.203,9.309],[126.17,9.309],[126.119,9.257],[126.057,9.233],[125.983,9.327],[125.973,9.355],[125.986,9.381],[125.981,9.403],[125.949,9.371],[125.894,9.414],[125.896,9.429],[125.916,9.439],[125.949,9.44],[125.959,9.483],[125.931,9.457],[125.917,9.496],[125.884,9.497],[125.879,9.469],[125.744,9.318],[125.756,9.23],[125.775,9.223],[125.866,9.093],[125.885,9.047],[125.899,8.869],[125.949,8.814],[125.97,8.74],[126.035,8.633],[126.0,8.6],[126.0,8.571],[126.027,8.569],[126.033,8.539],[126.016,8.499],[126.055,8.448],[126.074,8.445],[126.064,8.429],[126.082,8.407],[126.114,8.391],[126.129,8.363],[126.125,8.323],[126.2,8.288],[126.165,8.26],[126.183,8.245],[126.155,8.223],[126.237,8.132],[126.237,8.059],[126.263,8.06],[126.25,8.04],[126.257,8.028],[126.228,8.0]]],[[[126.012,9.43],[125.993,9.416],[126.024,9.414],[126.012,9.43]]]]}},{"type":"Feature","properties":{"province":"Dinagat Islands"},"geometry":{"type":"MultiPolygon","coordinates":[[[[125.511,10.186],[125.477,10.125],[125.481,10.104],[125.498,10.101],[125.497,10.079],[125.51,10.062],[125.528,10.062],[125.539,10.081],[125.573,10.066],[125.567,10.084],[125.585,10.082],[125.6,10.059],[125.569,10.018],[125.578,10.003],[125.569,9.989],[125.608,9.984],[125.602,9.965],[125.646,9.931],[125.643,9.882],[125.66,9.852],[125.677,9.868],[125.701,9.867],[125.707,9.899],[125.673,9.917],[125.676,9.931],[125.657,9.947],[125.679,9.962],[125.673,9.99],[125.695,10.048],[125.692,10.08],[125.664,10.114],[125.663,10.154],[125.675,10.154],[125.676,10.167],[125.651,10.167],[125.644,10.185],[125.662,10.197],[125.644,10.243],[125.655,10.277],[125.646,10.295],[125.677,10.395],[125.642,10.472],[125.609,10.432],[125.596,10.365],[125.582,10.359],[125.552,10.385],[125.552,10.32],[125.514,10.321],[125.521,10.246],[125.512,10.242],[125.541,10.204],[125.526,10.191],[125.523,10.202],[125.499,10.208],[125.511,10.186]]],[[[125.49,10.422],[125.502,10.446],[125.472,10.462],[125.463,10.457],[125.477,10.428],[125.49,10.422]]],[[[125.519,10.027],[125.518,10.008],[125.538,10.009],[125.519,10.027]]]]}}]};

// DOH-13 dengue cases as of July 25, 2026 (source: PNA, "DOH monitors, responds to dengue cases in Caraga Region")
const caseData = {
  "Agusan del Norte": 79, "Agusan del Sur": 492, "Dinagat Islands": 74,
  "Surigao del Norte": 242, "Surigao del Sur": 363
};
const priorYearTotal = 5813, currentTotal = 1813; // region-wide, same period prior year vs 2026

// Historical hotspot barangays named in DOH-13's 2019 hotspot advisory (source: PIA Caraga)
const hotspots = [
  {name:"Brgy. Abilan, Buenavista",prov:"Agusan del Norte",lat:8.97,lng:125.41,year:2019},
  {name:"Brgy. Pinana-an, Las Nieves",prov:"Agusan del Norte",lat:8.7351,lng:125.601,year:2019},
  {name:"Brgy. Daywan, Claver",prov:"Surigao del Norte",lat:9.5667,lng:125.7333,year:2019},
  {name:"Brgy. Maligaya, Rosario",prov:"Agusan del Sur",lat:8.3814,lng:126.0015,year:2019},
  {name:"Brgys. Canlanipa, Luna, Washington, San Juan — Surigao City",prov:"Surigao del Norte",lat:9.79,lng:125.5,year:2019}
];

// Referral hospitals, approximate to provincial-capital city centers (exact facility coordinates need field survey)
const facilities = [
  {name:"Butuan City referral hospitals (regional center)",lat:8.9475,lng:125.5406,note:"Butuan City — 1,653 cases in 2024 (separate HUC, not counted in province totals above)"},
  {name:"Agusan del Norte Provincial Hospital area — Cabadbaran",lat:9.1228,lng:125.5346},
  {name:"Agusan del Sur Provincial Hospital area — Prosperidad",lat:8.6,lng:125.9167},
  {name:"Surigao del Norte Provincial Hospital area — Surigao City",lat:9.79,lng:125.5},
  {name:"Surigao del Sur Provincial Hospital area — Tandag City",lat:9.0778,lng:126.1989},
  {name:"Dinagat Islands Provincial Hospital area — San Jose",lat:10.0095,lng:125.5708}
];

// ---------- MAP ----------
const map = L.map('map',{zoomControl:false}).setView([9.1,125.9],8);
L.control.zoom({position:'bottomleft'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap contributors | Boundaries: PSGC via faeldon/philippines-json-maps | Dengue data: DOH-13/PNA (as of Jul 25, 2026)',maxZoom:14
}).addTo(map);

function colorFor(n){ return n>450?'#7a0d0d': n>300?'#b3311c': n>150?'#e0713e': n>75?'#f0b429':'#f5d98a'; }

// ---- Turf-based spatial analysis: cases per 1,000 km² (density) ----
const provLayer = L.geoJSON(provinces,{
  style: f => ({fillColor:colorFor(caseData[f.properties.province]), color:'#3a3a2e', weight:1, fillOpacity:.68}),
  onEachFeature:(f,layer)=>{
    const p = f.properties.province, cases = caseData[p];
    const areaKm2 = turf.area(f)/1e6;                 // Turf spatial analysis
    const density = (cases/areaKm2*1000).toFixed(1);   // cases per 1,000 km²
    layer.bindPopup(
      `<div class="popup-title">${p}</div>`+
      `Dengue cases (as of Jul 25, 2026): <b>${cases}</b><br>`+
      `Area (computed via Turf.js): ${areaKm2.toFixed(0)} km²<br>`+
      `Case density: <b>${density}</b> cases / 1,000 km²<br>`+
      `<span class="src">Source: DOH-13 via Philippine News Agency, region total down from ${priorYearTotal} to ${currentTotal} vs. same period last year.</span>`
    );
    layer.province = p;
  }
}).addTo(map);

const hotspotLayer = L.layerGroup(hotspots.map(h=>
  L.circleMarker([h.lat,h.lng],{radius:7,color:'#7a0d0d',fillColor:'#ff6a4d',fillOpacity:.9,weight:2})
    .bindPopup(`<div class="popup-title">${h.name}</div>${h.prov}<br>Flagged as a dengue hotspot in ${h.year}<span class="badge" style="background:#7a0d0d">historical</span><br><span class="src">Source: DOH-13 / PIA Caraga hotspot advisory, ${h.year}. Marker placed at municipality/city center — not exact barangay centroid.</span>`)
)).addTo(map);

// ---- Turf-based spatial analysis: 15km catchment buffer around each referral facility ----
const facMarkers = [], catchmentLayer = L.layerGroup();
facilities.forEach(fac=>{
  const pt = turf.point([fac.lng,fac.lat]);
  const buf = turf.buffer(pt, 15, {units:'kilometers'});
  L.geoJSON(buf,{style:{color:'#0f6b4c',weight:1,dashArray:'4,3',fillOpacity:.06}}).addTo(catchmentLayer);
  const m = L.marker([fac.lat,fac.lng],{icon:L.divIcon({className:'',html:'🏥',iconSize:[22,22]})})
    .bindPopup(`<div class="popup-title">${fac.name}</div>${fac.note||''}<br><span class="src">Approx. location (provincial-capital city center). 15 km catchment shown — exact facility coordinates require field verification.</span>`);
  facMarkers.push(m);
});
const facilityLayer = L.layerGroup(facMarkers).addTo(map);
catchmentLayer.addTo(map);

// ---- Spatial insight: province centroid distance to nearest facility ----
let insight = '';
provinces.features.forEach(f=>{
  const c = turf.centroid(f);
  let minD = Infinity;
  facilities.forEach(fac=>{ const d = turf.distance(c, turf.point([fac.lng,fac.lat]), {units:'kilometers'}); if(d<minD) minD=d; });
  if(minD>25) insight += `${f.properties.province} (~${minD.toFixed(0)} km), `;
});

L.control.layers(null,{
  "Dengue cases by province (choropleth)": provLayer,
  "Historical hotspot barangays (2019)": hotspotLayer,
  "Referral hospitals": facilityLayer,
  "15km facility catchment (Turf buffer)": catchmentLayer
},{collapsed:false, position:'topright'}).addTo(map);

// ---- Province jump / search ----
const jump = L.control({position:'topleft'});
jump.onAdd = function(){
  const div = L.DomUtil.create('div','panel');
  div.innerHTML = `<b>Jump to province</b><br><select id="provSel" style="margin-top:4px;width:190px;">
    <option value="">— select —</option>` +
    provinces.features.map(f=>`<option>${f.properties.province}</option>`).join('') + `</select>
    <div class="src">Type: DOH-13 case data (Jul 2026) · Boundaries: PSGC 2023</div>`;
  L.DomEvent.disableClickPropagation(div);
  return div;
};
jump.addTo(map);
setTimeout(()=>{
  document.getElementById('provSel').addEventListener('change', e=>{
    const name = e.target.value; if(!name) return;
    provLayer.eachLayer(l=>{ if(l.province===name){ map.fitBounds(l.getBounds(),{maxZoom:10}); l.openPopup(); } });
  });
},300);

// ---- Legend ----
const legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  const div = L.DomUtil.create('div','panel legend');
  div.innerHTML = `<b>Dengue cases (as of Jul 25, 2026)</b>`+
    [[451,'7a0d0d','450+'],[301,'b3311c','301–450'],[151,'e0713e','151–300'],[76,'f0b429','76–150'],[0,'f5d98a','0–75']]
    .map(([_,c,l])=>`<div class="row"><span class="sw" style="background:#${c}"></span>${l} cases</div>`).join('')+
    `<div class="src">Provinces &gt;25 km (centroid) from nearest referral hospital: <b>${insight? insight.slice(0,-2):'none'}</b> — Turf.js distance analysis.</div>`;
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
